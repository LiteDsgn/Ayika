<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Ayika forms</title>
  </head>
  <body>
    <!-- Static form definitions for Netlify Forms. Netlify scans this file at deploy time;
         components/ui/WaitlistForm.tsx posts to it. Keep the field names in sync. -->
    <form name="waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="email" name="email" />
      <input type="text" name="source" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
